{% extends "base.html" %}
{% block title %}{% if invoice %}Edit invoice{% else %}New invoice{% endif %} | {{ APP_NAME }}{% endblock %}
{% block content %}<div class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><h1>{% if invoice %}Edit draft invoice{% else %}New invoice{% endif %}</h1><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Save invoice</button><a class="btn btn-outline-secondary" href="{% if invoice %}{% url 'invoices:detail' invoice.id %}{% else %}{% url 'invoices:list' %}{% endif %}">Cancel</a></div></form></div></div></div>{% endblock %}
