<nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">{{ APP_NAME }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <div class="navbar-nav ms-auto">
                {% block navigation_links %}{% endblock %}
                {% if user.is_authenticated %}
                    {% if ACTIVE_BUSINESS %}
                    <a class="nav-link" href="{% url 'workspaces:dashboard' %}">Dashboard</a>
                    {% if ACTIVE_MEMBERSHIP.role == "owner" %}
                    <a class="nav-link" href="{% url 'crm:contact-list' %}">Contacts</a>
                    <a class="nav-link" href="{% url 'catalog:item-list' %}">Catalog</a>
                    <a class="nav-link" href="{% url 'estimates:list' %}">Estimates</a>
                    <a class="nav-link" href="{% url 'invoices:list' %}">Invoices</a>
                    <a class="nav-link" href="{% url 'workspaces:settings' %}">Settings</a>
                    {% endif %}
                    {% endif %}
                    <form method="post" action="{% url 'users:logout' %}" class="d-flex">
                        {% csrf_token %}
                        <button class="nav-link border-0 bg-transparent" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                    <a class="nav-link" href="{% url 'users:register' %}">Create account</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
