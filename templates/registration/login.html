{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="container py-5">
<div class="row justify-content-center"><div class="col-md-7 col-lg-5 col-xl-4"><div class="auth-panel">
<p class="page-eyebrow">Welcome back</p><h1 class="h2">Log in</h1><p class="text-body-secondary">Continue managing your clients, estimates, and invoices.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100" type="submit">Log in</button>
</form>

<p class="mt-3 mb-2"><a href="{% url 'users:password_reset' %}">Forgot your password?</a></p>
<p class="mb-0">New here? <a href="{% url 'users:register' %}">Create an account.</a></p>
</div></div></div></div>
{% endblock %}
